info:
  contact: {}
  description: Contract for the Nex HTTP API.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  title: Nex API
  version: 1.0.0
paths:
  /api/advertisements:
    get:
      operationId: advertisements_route_get
      parameters:
      - description: page
        in: query
        name: page
        type: integer
      - description: limit
        in: query
        name: limit
        type: integer
      - description: search
        in: query
        name: search
        type: string
      - description: position
        in: query
        name: position
        type: string
      - description: isActive
        in: query
        name: isActive
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/main.SwaggerEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.AdvertisementResp'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.SwaggerEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.SwaggerEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.SwaggerEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.SwaggerEnvelope'
      security:
      - SessionCookie: []
      summary: GET /api/advertisements
